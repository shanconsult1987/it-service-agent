
name: IT Service Agent Security Checks

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit application dependencies
        run: |
          pip-audit -r requirements.txt

  static-analysis:
    name: Bandit Python security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan application Python
        run: bandit -r app -ll
